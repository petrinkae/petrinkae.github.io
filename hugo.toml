baseURL = "example.com"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
# disableKinds = ['taxonomy', 'term']
theme = "hermit-v2"
enableRobotsTXT = true ## set to true to enable inbuilt robots.txt

#[languages]
#  [languages.en]
#    title = 'CHANGE ME'
#    [languages.en.params]
#      homeSubtitle = "CHANGE ME"
#    weight = 1
#  [languages.fr]
#    title = 'CHANGE ME(FR)'
#    [languages.fr.params]
