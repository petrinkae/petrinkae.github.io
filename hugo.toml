#    weight = 2
#  [languages.it]
#    title = 'CHANGE ME(IT)'
#    [languages.it.params]
#      homeSubtitle = "CHANGE ME"
#    weight = 3
 
languageCode = "en-us"

title = "K Petrin"
# enableGitInfo = true

pygmentsCodefences  = true
pygmentsUseClasses  = true
#hasCJKLanguage = true

rssLimit = 10

copyright = "K Petrin"
enableEmoji = true

#[services]
#  [services.disqus]
#    shortname = ''
#  [services.googleAnalytics]
#    id = ''

[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = ["lastmod", ":git", "date", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]


[params.author]
  name = "petrinkae"
  about = "about"

[blackfriday]
  # hrefTargetBlank = true
  # noreferrerLinks = true
  # nofollowLinks = true

[taxonomies]
  tag = "tags"
  # Categories are disabled by default.
  # category = "categories"

# Enable to get proper Mathjax support
#[markup]
#  [markup.goldmark]
#    [markup.goldmark.extensions]
#      [markup.goldmark.extensions.passthrough]
#        enable = true
#        [markup.goldmark.extensions.passthrough.delimiters]
#          block = [['\[', '\]'], ['$$', '$$']]
#          inline = [['\(', '\)']]

[markup.goldmark.renderer]
   unsafe = true

[params]
  description = "K Petrin's personal site"
  images = ["/images/polygon_3.png"]
  themeColor = "#494f5c"
  accentColor = "#018472"

  homeSubtitle = "Data journalist. Nonprofit leader. Media educator."
  footerCopyright = "CC BY-NC-ND 4.0"
  # footerHideThemeName = false
  # bgImg = ""
  # gitUrl = "https://github.com/1bl4z3r/hermit-V2/tree/staging"

  justifyContent = false

  relatedPosts = true
  code_copy_button = true

  homeSubtitlePrinter = true
  scrollToTop = true 
  global_mathjax = false
  readTime = true
  readTimeSeparator = " | | xxx"
  # legacyLayout = false
  shareSocial = true
  # googleTagManager = "GTM-XXXXXXXX"
  tagSymbol = "#"
  categorySymbol = "⊲"
  pinned = "Pinned Posts"
  # pinnedSVGname = "pin"
  listLayout = ["description","tags","categories","legacy"]
  # initialPublish = "Initally Posted on: "
  human = ["single","posts"]
  # noIndex = false
  denyRobots = "noindex, nofollow, noarchive"
  # allowRobots = "index, follow"
  # siteNoIndex = false
  noIndexPages = ["404 Page not found"]
  # usesAnimation = true
  # mathjaxLib = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
  # mermaidLib = "https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs"
  [params.gallery]
    enable = true
    thumbnail = '300'

  [caches]
    [caches.images]
      dir = ':cacheDir/images'

  [params.dateform]
    CopyrightDate = "2006"
    LongDate = "Jan 2, 2006"
    ShortDate = "Jan 2"
    NumDateShort = "2006-01-02"
    NumDateLong = "2006-01-02 15:04 -0700"

  [[params.socialLinks]]
    name = "email"
    url = "mailto:petrinkae@pm.me"

  [[params.socialLinks]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/petrinkae/"

  [[params.socialLinks]]
    name = "bluesky"
    url = "https://bsky.app/profile/petrinkae.bsky.social"

  [[params.socialLinks]]
    name = "medium"
    url = "https://medium.com/@petrinkae"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/petrinkae"

  [[params.socialLinks]]
    name = "buttondown"
    url = "https://buttondown.com/stetdele"

